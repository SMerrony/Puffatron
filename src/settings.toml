# settings.toml for Puffatron

# DEBUG should be false for normal use - it slows down Puffaton response
DEBUG = true

MIDI_CHANNEL = 0

LOWEST_NOTE = 60  # Middle-C
HIGHEST_NOTE = 72 # c 

# The values below seem OK for a 10V power supply

PWM_FREQ = 880
ATTACK_PWM_DUTY_CYCLE = 65535
ATTACK_DURATION_MS = 150
# Below should be the lowest value that reliably keeps the solenoids energised
HOLD_PWM_DUTY_CYCLE   = 15000
